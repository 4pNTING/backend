# Seed 10 Customer records
# Run each mutation in Apollo Sandbox (http://localhost:3000/api-gateway)
# Copy one at a time, or run as a batch

mutation Seed1 {
  createCustomer(
    input: {
      firstName: "ສົມສະຫວາດ"
      lastName: "ແກ້ວມະນີ"
      phoneNumber: "02055551234"
      gender: "male"
      nationality: "Lao"
      province: "ນະຄອນຫຼວງ"
      district: "ສີສັດຕະນາກ"
      village: "ວັດນາກ"
    }
  ) {
    customer {
      _id
      firstName
      lastName
      phoneNumber
    }
  }
}

